<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsightCare | Secure Online Consultation</title>
    
    <!-- Scripts & Stylesheets -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- External CSS -->
    <link rel="stylesheet" href="../styles.css">
</head>

<body class="bg-slate-900 text-slate-100 font-sans antialiased overflow-hidden min-h-screen flex flex-col">

    <!-- Fixed Header for Consultation -->
    <header class="bg-slate-900 border-b border-slate-800 py-4 px-6 flex justify-between items-center z-20 shadow-md">
        <div class="flex items-center gap-3 text-brand-400 font-bold text-xl">
            <i class="fa-solid fa-heart-pulse"></i> InsightCare Virtual Clinic
        </div>
        <div class="flex items-center gap-4 text-sm font-medium">
            <div class="px-3 py-1 bg-red-500/20 text-red-500 rounded-full flex items-center gap-2 animate-pulse">
                <span class="w-2 h-2 bg-red-500 rounded-full"></span> Live Encrypted Network
            </div>
            <div class="hidden sm:block text-slate-400 border-l border-slate-700 pl-4">
                Consultant: Dr. Aayush Prajapati
            </div>
        </div>
    </header>

    <!-- Main Consultation Area -->
    <main class="flex-grow flex flex-col lg:flex-row relative z-10 w-full h-[calc(100vh-73px)]">
        
        <!-- Video Section -->
        <div class="flex-grow bg-black relative flex flex-col justify-center items-center overflow-hidden h-full">
            
            <!-- Remote Video (Full Screen) -->
            <div class="absolute inset-0 w-full h-full flex items-center justify-center bg-slate-900">
                <div class="placeholder-view text-center absolute z-0 flex flex-col items-center">
                    <div class="w-24 h-24 rounded-full bg-slate-800 text-slate-500 flex items-center justify-center text-4xl mb-4 border-2 border-slate-700 pointer-events-none shadow-[0_0_50px_rgba(16,185,129,0.05)]">
                        <i class="fa-solid fa-user-doctor"></i>
                    </div>
                    <p class="text-slate-400 animate-pulse font-medium">Waiting for doctor to join...</p>
                </div>
                <video id="remote-video" class="w-full h-full object-cover z-10" autoplay playsinline></video>
            </div>
            
            <!-- Local Video (Picture in Picture) -->
            <div class="absolute top-6 right-6 w-32 sm:w-48 md:w-64 aspect-video bg-slate-800 rounded-xl overflow-hidden shadow-2xl border-2 border-slate-700 z-20 transition-all hover:scale-105 duration-300">
                <video id="local-video" class="w-full h-full object-cover transform -scale-x-100" autoplay muted playsinline></video>
                <div class="absolute bottom-2 right-2 bg-black/60 backdrop-blur-sm px-2 py-1 rounded text-xs">You</div>
            </div>

            <!-- Controls Overlay -->
            <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 z-30 flex items-center gap-4 bg-slate-900/80 backdrop-blur-md p-3 rounded-full border border-slate-700 shadow-[0_10px_40px_rgba(0,0,0,0.5)]">
                
                <button id="mute-audio" title="Mute Audio" class="w-12 h-12 rounded-full bg-white text-slate-700 hover:text-brand-500 hover:bg-slate-50 flex items-center justify-center transition-all shadow-sm">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                
                <button id="mute-video" title="Mute Video" class="w-12 h-12 rounded-full bg-white text-slate-700 hover:text-brand-500 hover:bg-slate-50 flex items-center justify-center transition-all shadow-sm">
                    <i class="fa-solid fa-video"></i>
                </button>
                
                <button id="screen-share" title="Share Screen" class="hidden sm:flex w-12 h-12 rounded-full bg-white text-slate-700 hover:text-brand-500 hover:bg-slate-50 items-center justify-center transition-all shadow-sm">
                    <i class="fa-solid fa-display"></i>
                </button>

                <div class="w-px h-8 bg-slate-700 mx-2"></div>
                
                <button id="end-call" title="End Call" class="px-6 h-12 rounded-full bg-red-500 text-white hover:bg-red-600 flex items-center justify-center gap-2 font-semibold transition-all shadow-[0_0_15px_rgba(239,68,68,0.4)]">
                    <i class="fa-solid fa-phone-slash"></i> <span class="hidden sm:inline">End</span>
                </button>
            </div>
            
        </div>

        <!-- Chat Sidebar -->
        <div class="w-full lg:w-[350px] bg-slate-900 border-l border-slate-800 flex flex-col h-full z-20">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900 text-white">
                <h3 class="font-semibold flex items-center gap-2"><i class="fa-regular fa-message text-brand-500"></i> Live Chat</h3>
            </div>
            
            <div id="chat-messages" class="flex-grow p-4 overflow-y-auto flex flex-col space-y-4 bg-slate-800/50">
                <!-- Chat Notification System Message -->
                <div class="text-center my-2 text-xs text-slate-500 font-medium">Session secured with end-to-end encryption</div>
            </div>
            
            <div class="p-4 border-t border-slate-800 bg-slate-900">
                <div class="flex items-end gap-2 relative">
                    <textarea id="chat-box" rows="2" placeholder="Message Doctor..." class="w-full bg-slate-800 border border-slate-700 text-white text-sm rounded-xl px-4 py-3 outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 resize-none"></textarea>
                    <button id="send-message" class="absolute bottom-2 right-2 w-8 h-8 flex items-center justify-center bg-brand-500 hover:bg-brand-600 transition-colors text-white rounded-lg">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="consultation.js"></script>
</body>
</html>
